name: Compilar y Publicar CineAnime Studio (Desktop App)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Empaquetar motor Python como binario autónomo (PyInstaller)
        run: |
          pyinstaller --noconfirm --onedir --name cineanime-backend --distpath backend_bin backend/app.py

      - name: Instalar dependencias de Electron
        run: |
          npm ci || npm install

      - name: Compilar App para macOS (.dmg y .zip)
        if: runner.os == 'macOS'
        run: |
          npm run build:mac

      - name: Compilar App para Windows (.exe)
        if: runner.os == 'Windows'
        run: |
          npm run build:win

      - name: Subir instaladores como artefactos de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: CineAnime-Studio-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: warn

      - name: Publicar instaladores en GitHub Releases (al crear un Tag)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
